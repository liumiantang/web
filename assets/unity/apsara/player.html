<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="transparent" />
    <title>敦煌飞天动画</title>
    <style>
      :root, html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
      #unity-canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; outline: 0; opacity: 0; background: transparent; touch-action: none; }
      #apsara-composite { position: absolute; inset: 0; display: block; width: 100%; height: 100%; pointer-events: none; background: transparent; }
      #loading, #error { position: fixed; z-index: 2; inset: 0; display: grid; place-items: center; color: #e8d4aa; font: 12px/1.6 system-ui, sans-serif; letter-spacing: .12em; text-align: center; pointer-events: none; }
      #loading { opacity: .72; }
      #error { display: none; color: #ffd0bd; background: rgb(30 12 9 / 72%); padding: 24px; box-sizing: border-box; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1" aria-label="敦煌飞天骨骼动画"></canvas>
    <canvas id="apsara-composite" aria-hidden="true"></canvas>
    <div id="loading">飞天入画 · <span id="progress">0%</span></div>
    <div id="error" role="alert"></div>
    <script>
      (() => {
        const canvas = document.querySelector('#unity-canvas');
        const compositeCanvas = document.querySelector('#apsara-composite');
        const compositeContext = compositeCanvas.getContext('2d', { alpha: true, willReadFrequently: true });
        const progressLabel = document.querySelector('#progress');
        const loading = document.querySelector('#loading');
        const errorPanel = document.querySelector('#error');
        const rigRootName = 'DunhuangStoryApsaraPreview';
        let unityInstance = null;
        let latestProgress = '0';
        const matteColor = [19, 16, 23];
        let lastCompositeAt = 0;
        const clamp = (value, min = 0, max = 1) => Math.min(max, Math.max(min, value));

        function compositeTransparentFrame(now) {
          if (!unityInstance) return;
          if (now - lastCompositeAt >= 1000 / 30) {
            lastCompositeAt = now;
            const width = canvas.width;
            const height = canvas.height;
            if (compositeCanvas.width !== width || compositeCanvas.height !== height) {
              compositeCanvas.width = width;
              compositeCanvas.height = height;
            }

            compositeContext.clearRect(0, 0, width, height);
            compositeContext.drawImage(canvas, 0, 0, width, height);
            const frame = compositeContext.getImageData(0, 0, width, height);
            for (let index = 0; index < frame.data.length; index += 4) {
              if (frame.data[index + 3] < 250) continue;

              const dr = frame.data[index] - matteColor[0];
              const dg = frame.data[index + 1] - matteColor[1];
              const db = frame.data[index + 2] - matteColor[2];
              const distance = Math.sqrt(dr * dr + dg * dg + db * db);
              const tolerance = 26;
              const edge = 4;
              if (distance >= tolerance) continue;

              const alpha = clamp((distance - edge) / (tolerance - edge));
              if (alpha <= 0.01) {
                frame.data[index + 3] = 0;
                continue;
              }

              const inverseAlpha = 1 / alpha;
              frame.data[index] = clamp((frame.data[index] - matteColor[0] * (1 - alpha)) * inverseAlpha, 0, 255);
              frame.data[index + 1] = clamp((frame.data[index + 1] - matteColor[1] * (1 - alpha)) * inverseAlpha, 0, 255);
              frame.data[index + 2] = clamp((frame.data[index + 2] - matteColor[2] * (1 - alpha)) * inverseAlpha, 0, 255);
              frame.data[index + 3] = Math.round(alpha * 255);
            }
            compositeContext.putImageData(frame, 0, 0);
          }
          window.requestAnimationFrame(compositeTransparentFrame);
        }

        function setProgress(value) {
          const normalized = Math.min(1, Math.max(0, Number(value) || 0));
          latestProgress = normalized.toFixed(4);
          if (unityInstance) unityInstance.SendMessage(rigRootName, 'SetScrollProgress', latestProgress);
        }

        window.addEventListener('message', (event) => {
          if (event.source !== window.parent || event.data?.type !== 'apsara-scroll') return;
          setProgress(event.data.progress);
        });

        const config = {
          dataUrl: 'Build/index.html.data.br?v=20261002u',
          frameworkUrl: 'Build/index.html.framework.js.br?v=20261002u',
          codeUrl: 'Build/index.html.wasm.br?v=20261002u',
          streamingAssetsUrl: 'StreamingAssets',
          companyName: 'Dunhuang Story',
          productName: 'Apsara Flight',
          productVersion: '1.0',
          webglContextAttributes: { alpha: true, premultipliedAlpha: true, preserveDrawingBuffer: true },
          decompressionFallback: true,
          showBanner: (message, type) => {
            if (type === 'error') {
              errorPanel.textContent = message;
              errorPanel.style.display = 'grid';
            }
          }
        };

        fetch('bridge-ready.json', { cache: 'no-store' }).then((response) => {
          if (!response.ok) return false;
          return true;
        }).then((bridgeReady) => {
          if (!bridgeReady) {
            loading.textContent = '飞天骨骼动画准备中';
            return;
          }

          const loader = document.createElement('script');
          loader.src = 'Build/index.html.loader.js';
          loader.onload = () => {
            createUnityInstance(canvas, config, (value) => {
              progressLabel.textContent = `${Math.round(value * 100)}%`;
            }).then((instance) => {
              unityInstance = instance;
              window.requestAnimationFrame(compositeTransparentFrame);
              loading.style.display = 'none';
              setProgress(latestProgress);
              window.parent.postMessage({ type: 'apsara-unity-ready' }, '*');
            }).catch((error) => {
              errorPanel.textContent = String(error);
              errorPanel.style.display = 'grid';
            });
          };
          loader.onerror = () => {
            errorPanel.textContent = '飞天动画加载失败';
            errorPanel.style.display = 'grid';
          };
          document.body.appendChild(loader);
        });
      })();
    </script>
  </body>
</html>
